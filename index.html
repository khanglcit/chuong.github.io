<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🚨 Chuông Khẩn Cấp - Siêu To</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            text-align: center; 
            background: #f4f4f9; 
            color: #333;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            min-height: 100dvh;
        }
        .hidden { display: none !important; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); max-width: 400px; width: 100%; }
        
        .btn { 
            padding: 16px; font-size: 18px; margin: 12px 0; cursor: pointer; 
            border-radius: 12px; border: none; background: #007bff; color: white; width: 100%; font-weight: bold; transition: 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        
        .btn-sos { 
            background: #dc3545; font-size: 32px; font-weight: bold; color: white;
            width: 200px; height: 200px; border-radius: 50%; border: 8px solid #ff9ea7;
            box-shadow: 0 10px 25px rgba(220, 53, 69, 0.4); cursor: pointer;
            transition: all 0.2s ease; margin: 20px auto;
            display: flex; align-items: center; justify-content: center;
            user-select: none; -webkit-user-select: none;
        }
        .btn-sos.active-ring {
            background: #28a745; border-color: #a3e6b5;
            box-shadow: 0 10px 25px rgba(40, 167, 69, 0.4);
            animation: pulse 1.5s infinite;
        }
        
        input { 
            padding: 15px; font-size: 22px; border-radius: 12px; border: 2px solid #ddd; 
            width: 100%; text-align: center; margin-bottom: 15px; font-weight: bold;
        }
        #bell-id { font-size: 42px; color: #007bff; letter-spacing: 5px; margin: 15px 0; background: #e9ecef; border-radius: 12px; padding: 12px; font-weight: bold; }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .ringing { animation: shake 0.5s infinite; color: #dc3545; font-size: 28px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚨 SOS Bell</h1>

        <div id="step1">
            <h3>Chọn chức năng cho máy này:</h3>
            <button class="btn" onclick="selectRole('bell')" style="background: #28a745;">🔔 Làm Máy Nhận (Chuông)</button>
            <button class="btn" onclick="selectRole('button')" style="background: #dc3545;">🔴 Làm Máy Gửi (Nút bấm)</button>
        </div>

        <div id="bell-screen" class="hidden">
            <div id="audio-unlock-section">
                <p style="color: #666;">Bấm nút dưới để kích hoạt hệ thống loa công suất lớn:</p>
                <button class="btn" onclick="unlockAudioAndSetup()" style="background: #ffc107; color: #212529;">🔊 KÍCH HOẠT LOA (MAX VOL)</button>
            </div>
            
            <div id="bell-info-section" class="hidden">
                <h3>Mã kết nối của bạn:</h3>
                <div id="bell-id">Đang tạo...</div>
                <p>Nhập mã này vào máy bấm để kết nối nhé!</p>
                <h2 id="ring-status" class="hidden ringing">🚨 ĐANG REO TO!!! 🚨</h2>
            </div>
        </div>

        <div id="button-screen" class="hidden">
            <div id="connect-section">
                <h3>Nhập mã kết nối:</h3>
                <input type="number" pattern="[0-9]*" inputmode="numeric" id="target-id" placeholder="VD: 12345">
                <button class="btn" onclick="connectToBell()">Kết Nối Ngay</button>
                <p id="connect-status" style="color: #666;"></p>
            </div>
            
            <div id="control-section" class="hidden">
                <h3 style="color: #28a745;">✅ Đã kết nối thành công!</h3>
                <p>Bấm 1 lần để bật chuông, bấm lại để tắt.</p>
                
                <button id="sos-btn" class="btn-sos" onclick="toggleRing()">
                    SOS
                </button>
            </div>
        </div>
    </div>

    <audio id="alarm-sound" src="https://actions.google.com/sounds/v1/alarms/industrial_alarm_loop.ogg" loop preload="auto" crossorigin="anonymous"></audio>

    <script>
        let peer = null;
        let conn = null;
        let isRinging = false;
        const prefix = "chuong-sos-khang-"; 
        const sound = document.getElementById('alarm-sound');
        
        // Biến phục vụ khuếch đại âm thanh
        let audioCtx = null;
        let gainNode = null;
        let source = null;

        function selectRole(role) {
            document.getElementById('step1').classList.add('hidden');
            if (role === 'bell') {
                document.getElementById('bell-screen').classList.remove('hidden');
            } else {
                document.getElementById('button-screen').classList.remove('hidden');
                setupButton();
            }
        }

        // --- XỬ LÝ MÁY CHUÔNG ---
        function unlockAudioAndSetup() {
            // Khởi tạo hệ thống kích âm thanh (Web Audio API)
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    gainNode = audioCtx.createGain();
                    source = audioCtx.createMediaElementSource(sound);
                    
                    // KHUẾCH ĐẠI: Thay đổi số này để chỉnh độ to (3.0 tức là to gấp 3 lần bình thường)
                    gainNode.gain.value = 3.0; 
                    
                    // Kết nối luồng âm thanh qua bộ kích trước khi ra loa
                    source.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                }
                
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch (e) {
                console.log("Trình duyệt không hỗ trợ Web Audio API nâng cao, dùng loa mặc định.");
            }

            // Test âm thanh nhẹ để mở khóa quyền iOS
            sound.play().then(() => {
                sound.pause();
                sound.currentTime = 0;
            }).catch(e => console.log("Audio Unlocked"));

            document.getElementById('audio-unlock-section').classList.add('hidden');
            document.getElementById('bell-info-section').classList.remove('hidden');
            
            setupBell();
        }

        function setupBell() {
            const randomCode = Math.floor(10000 + Math.random() * 90000).toString();
            peer = new Peer(prefix + randomCode);

            peer.on('open', function(id) {
                document.getElementById('bell-id').innerText = randomCode;
            });

            peer.on('connection', function(connection) {
                connection.on('data', function(data) {
                    if (data === 'ring_start') {
                        if (audioCtx && audioCtx.state === 'suspended') {
                            audioCtx.resume();
                        }
                        sound.play().catch(e => alert("Hãy bấm vào màn hình chuông một lần để cấp quyền phát âm thanh!"));
                        document.getElementById('ring-status').classList.remove('hidden');
                    } else if (data === 'ring_stop') {
                        sound.pause();
                        sound.currentTime = 0;
                        document.getElementById('ring-status').classList.add('hidden');
                    }
                });
            });
        }

        // --- XỬ LÝ MÁY BẤM NÚT ---
        function setupButton() {
            peer = new Peer(); 
        }

        function connectToBell() {
            const targetCode = document.getElementById('target-id').value.trim();
            const statusText = document.getElementById('connect-status');
            
            if (!targetCode) {
                alert('Bạn chưa nhập mã kết nối kìa!');
                return;
            }
            
            statusText.innerText = "Đang kết nối...";
            conn = peer.connect(prefix + targetCode);
            
            conn.on('open', function() {
                document.getElementById('connect-section').classList.add('hidden');
                document.getElementById('control-section').classList.remove('hidden');
            });

            conn.on('error', function(err) {
                statusText.innerText = "Kết nối thất bại!";
                alert("Không kết nối được! Hãy kiểm tra mã hoặc đảm bảo Máy Chuông đã bật.");
            });
        }

        function toggleRing() {
            if (!conn || !conn.open) return;

            const sosBtn = document.getElementById('sos-btn');
            isRinging = !isRinging;

            if (isRinging) {
                conn.send('ring_start');
                sosBtn.innerText = "STOP";
                sosBtn.classList.add('active-ring');
            } else {
                conn.send('ring_stop');
                sosBtn.innerText = "SOS";
                sosBtn.classList.remove('active-ring');
            }
        }
    </script>
</body>
</html>
